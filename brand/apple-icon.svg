<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Home-screen icon. iOS draws these on their own rounded tile and does NOT
       punch transparency, so unlike the favicon this one carries its own
       ground and the tag is inset to sit inside Apple's corner radius.

       SOURCE ONLY — it lives here, not in app/, because Next.js's apple-icon
       file convention accepts png/jpg but NOT svg: an app/apple-icon.svg is
       silently ignored and the home-screen icon falls back to a screenshot.
       The shipped file is app/apple-icon.png. Regenerate it after any edit:

         node -e 'require("sharp")(require("fs").readFileSync("brand/apple-icon.svg"),{density:600}).resize(180,180).png().toFile("app/apple-icon.png")'
  -->
  <rect width="64" height="64" fill="#F9F6EC"/>
  <g transform="translate(32 32) scale(0.74) translate(-32 -32)">
    <defs>
      <mask id="hole">
        <rect width="64" height="64" fill="#fff"/>
        <circle cx="20" cy="32" r="4.4" fill="#000"/>
      </mask>
      <clipPath id="clip">
        <path d="M24 8 H56 A6 6 0 0 1 62 14 V50 A6 6 0 0 1 56 56 H24 L5.4 37.4 A7.6 7.6 0 0 1 5.4 26.6 Z"/>
      </clipPath>
    </defs>
    <g mask="url(#hole)">
      <path d="M24 8 H56 A6 6 0 0 1 62 14 V50 A6 6 0 0 1 56 56 H24 L5.4 37.4 A7.6 7.6 0 0 1 5.4 26.6 Z" fill="#0A6154"/>
      <g clip-path="url(#clip)"><path d="M62 14 L62 56 L20 56 Z" fill="#DAA23F"/></g>
    </g>
  </g>
</svg>
